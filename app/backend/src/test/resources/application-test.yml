spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/myblog_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      database: 1
myblog:
  image:
    storage: disk
    disk-path: build/test-images
  mail:
    mode: log
logging:
  level:
    com.myblog.mail: warn
